<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>N'Owl</title>
<style>
  html, body { margin:0; padding:0; background:#000; width:100%; height:100%; overflow:hidden; }
  #player-container { width:100%; height:100%; }
  #yt { width:100%; height:100%; }
</style>
</head>
<body>
<div id="player-container"><div id="yt"></div></div>
<!-- Файли пісень ком'юніті (таблиця_2) — грає цей <audio> замість YouTube,
     з тим самим протоколом подій (state/time), тож React-сторона їх не розрізняє. -->
<audio id="au" preload="auto"></audio>
<script>
  // Реальна сторінка нашого ж домену для мобільного WebView-плеєра (замість
  // джерела source={{html}} із підробним baseUrl) — YouTube відхиляв
  // ембед із фейковим origin ("Це відео недоступне", код 152), той самий
  // клас проблеми, що й помилка 153 у pop-out застосунку для ПК. Тут
  // справжній https-origin, тож офіційний IFrame Player API працює так
  // само надійно, як у вебі й на десктопі.
  var player = null;
  var ready = false;
  var pendingCmd = null;
  var ticker = null;

  function post(msg) {
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(msg));
  }

  function startTicker() {
    stopTicker();
    ticker = setInterval(function () {
      if (!player || !ready) return;
      try {
        var cur = player.getCurrentTime();
        var dur = player.getDuration();
        post({ type: 'time', current: cur, duration: dur });
      } catch (e) {}
    }, 500);
  }
  function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }

  function onPlayerReady() {
    ready = true;
    post({ type: 'ready' });
    if (pendingCmd) { handleCommand(pendingCmd); pendingCmd = null; }
  }

  function onPlayerStateChange(e) {
    var S = window.YT.PlayerState;
    if (e.data === S.PLAYING) { post({ type: 'state', state: 'playing' }); startTicker(); }
    else if (e.data === S.PAUSED) { post({ type: 'state', state: 'paused' }); stopTicker(); }
    else if (e.data === S.ENDED) { post({ type: 'state', state: 'ended' }); stopTicker(); }
    else if (e.data === S.BUFFERING) { post({ type: 'state', state: 'buffering' }); }
  }

  function onPlayerError(e) {
    post({ type: 'error', code: e && e.data });
  }

  function createPlayer(videoId, autoplay, start) {
    player = new window.YT.Player('yt', {
      width: '100%',
      height: '100%',
      videoId: videoId,
      playerVars: {
        autoplay: autoplay ? 1 : 0,
        controls: 1,
        rel: 0,
        modestbranding: 1,
        playsinline: 1,
        fs: 1,
        iv_load_policy: 3,
        start: start > 0 ? Math.floor(start) : 0
      },
      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange,
        onError: onPlayerError
      }
    });
  }

  // 'yt' | 'audio' — хто зараз грає; команди play/pause/seek/... йдуть активному.
  var mode = 'yt';
  var au = document.getElementById('au');
  var auVolume = 0.8;
  au.addEventListener('playing', function () { if (mode === 'audio') { post({ type: 'state', state: 'playing' }); startAudioTicker(); } });
  au.addEventListener('pause', function () { if (mode === 'audio' && !au.ended) { post({ type: 'state', state: 'paused' }); stopTicker(); } });
  au.addEventListener('ended', function () { if (mode === 'audio') { post({ type: 'state', state: 'ended' }); stopTicker(); } });
  au.addEventListener('waiting', function () { if (mode === 'audio') post({ type: 'state', state: 'buffering' }); });
  au.addEventListener('error', function () { if (mode === 'audio' && au.getAttribute('src')) post({ type: 'error', code: 'audio' }); });
  function startAudioTicker() {
    stopTicker();
    ticker = setInterval(function () {
      post({ type: 'time', current: au.currentTime || 0, duration: isFinite(au.duration) ? au.duration : 0 });
    }, 500);
  }
  function handleAudioCommand(cmd) {
    if (cmd.cmd === 'play') au.play().catch(function () {});
    else if (cmd.cmd === 'pause') au.pause();
    else if (cmd.cmd === 'stop') { au.pause(); au.removeAttribute('src'); au.load(); }
    else if (cmd.cmd === 'seekTo') au.currentTime = cmd.seconds;
  }

  function handleCommand(cmd) {
    if (!cmd) return;
    if (cmd.cmd === 'setVolume') { auVolume = cmd.volume / 100; au.volume = auVolume; }
    if (cmd.cmd === 'loadAudio') {
      mode = 'audio';
      try { if (player && ready) player.stopVideo(); } catch (e) {}
      au.volume = auVolume;
      au.src = cmd.url;
      if (cmd.autoplay !== false) au.play().catch(function () {});
      return;
    }
    if (cmd.cmd === 'load' && mode === 'audio') { mode = 'yt'; handleAudioCommand({ cmd: 'stop' }); }
    if (mode === 'audio') {
      // Гучність — і YouTube теж (якщо вже створений), щоб після повернення до відео вона збігалась.
      if (cmd.cmd === 'setVolume') { try { if (player && ready) player.setVolume(cmd.volume); } catch (e) {} }
      else handleAudioCommand(cmd);
      return;
    }
    if (cmd.cmd === 'load') {
      if (!window.YT || !window.YT.Player) { pendingCmd = cmd; return; }
      if (!player) { createPlayer(cmd.videoId, cmd.autoplay !== false, cmd.startSeconds); return; }
      if (!ready) { pendingCmd = cmd; return; }
      // startSeconds — пісня з файлом перемкнулась на відео: продовжуємо з того самого моменту.
      player.loadVideoById(cmd.startSeconds > 0 ? { videoId: cmd.videoId, startSeconds: cmd.startSeconds } : cmd.videoId);
      if (cmd.autoplay === false) { setTimeout(function () { try { player.pauseVideo(); } catch (e) {} }, 250); }
      return;
    }
    if (!player || !ready) { pendingCmd = cmd; return; }
    try {
      if (cmd.cmd === 'play') player.playVideo();
      else if (cmd.cmd === 'pause') player.pauseVideo();
      else if (cmd.cmd === 'stop') player.stopVideo();
      else if (cmd.cmd === 'seekTo') player.seekTo(cmd.seconds, true);
      else if (cmd.cmd === 'setVolume') player.setVolume(cmd.volume);
    } catch (e) {}
  }

  function onMessage(event) {
    var data;
    try { data = JSON.parse(event.data); } catch (e) { return; }
    handleCommand(data);
  }
  document.addEventListener('message', onMessage);
  window.addEventListener('message', onMessage);
  // Сигнал "сторінка й слухачі готові приймати команди" — окремо від 'ready'
  // (яке шле лише сам YT.Player після onReady). React-сторона чекає саме
  // на це повідомлення перед першим 'load', інакше замкнене коло: 'load'
  // ніколи не шлеться до 'ready', а 'ready' ніколи не приходить без
  // попереднього 'load' (створення плеєра).
  post({ type: 'pageReady' });

  window.onYouTubeIframeAPIReady = function () {
    if (pendingCmd && pendingCmd.cmd === 'load') { createPlayer(pendingCmd.videoId, pendingCmd.autoplay !== false, pendingCmd.startSeconds); pendingCmd = null; }
  };

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
</script>
</body>
</html>
