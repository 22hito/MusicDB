# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - musicDB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Run tests
        run: dotnet test Tests/MusicDB.Api.Tests/MusicDB.Api.Tests.csproj --configuration Release --no-build

      - name: dotnet publish
        # Публікуємо лише веб-проєкт (не всю .sln) — інакше в пакет деплою
        # потрапляють ще й тестові збірки (xunit тощо).
        run: dotnet publish MusicDB.Api.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      # azure/webapps-deploy@v3 (і з OIDC, і з publish-profile) стабільно падав
      # з "Bad Request (CODE: 400)" на своєму /api/publish (OneDeploy) виклику —
      # без жодних деталей у відповіді. Прямий виклик класичного Kudu
      # /api/zipdeploy з тими самими publish-profile креденшлами спрацював
      # одразу й надійно, тож деплоїмо напряму, без стороннього екшена.
      - name: Deploy via Kudu ZipDeploy
        shell: pwsh
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          $profileXml = [xml]$env:PUBLISH_PROFILE
          $zipProfile = $profileXml.publishData.publishProfile | Where-Object { $_.publishMethod -eq 'ZipDeploy' } | Select-Object -First 1
          $pair = "$($zipProfile.userName):$($zipProfile.userPWD)"
          $base64Auth = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($pair))

          Compress-Archive -Path * -DestinationPath deploy.zip -Force

          $headers = @{ Authorization = "Basic $base64Auth" }
          Invoke-RestMethod -Uri "https://musicdb-b5c4grhhdjdjd5gv.scm.polandcentral-01.azurewebsites.net/api/zipdeploy" `
            -Method Post -InFile deploy.zip -ContentType "application/zip" -Headers $headers -TimeoutSec 300
